<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./css/entrar.css">
        <title>Entra</title>
    </head>
    <body>
        <div>
            <main>
                <section id="principal">
                    <div>
                        <img src="./img/logotipo.png" alt="google">
                        <h1>Faça login</h1>
                        <p>Com sua conta Google. Essa conta ficará disponivel para outros apps do google no navegador</p>
                    </div>
                    <form>
                        <div class="field">
                            <label for="E-mail ou telefone">E-mail ou telefone</label>
                            <input id="email" name="email" type="text" placeholder="E-mail ou telefone">
                        </div>
                        <a href="https">Esqueçeu a senha</a>

                        <p>
                            Não esta no seu computador? Use o modo visitante para fazer login com privacidade. 
                            <a href="https">Saiba como usar o modo visitante</a>
                        </p>
                        
                        <div class="btn-group">
                            <button class="btn btn-primary" type="button">Criar conta</button>
                            <button class="btn btn-secondary" type="button">Avançar</button>
                        </div>
                    </form>
                </section>

                <section id="links">
                    <select name="idioma">
                        <option value="portugues">Português(Brasil)</option>
                        <option value="ingles">Inglês</option>
                        <option value="frances">Francês</option>
                        <option value="espanhol">Esponhol</option>
                    </select>
                    
                    <ul>
                        <li>Ajuda</li>
                        <li>privacidade</li>
                        <li>Termo</li>
                    </ul>
                    
                </section>
            </main>
        </div>
    </body>
</html>
